services:
  - type: web
    name: confine
    branch: codex/ucsd-beta
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: confine-db
          property: connectionString
      - key: BETA_ENABLED
        value: "true"
      - key: BETA_MONTHLY_RESPONSES
        value: "300"
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: confine-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
    region: oregon
    databaseName: confine_db
    user: confine_db_user
    postgresMajorVersion: "17"
